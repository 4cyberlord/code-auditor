name: Council language docs extraction
on:
  push:
    branches:
      - feat/r2-language-retrieval-20261015
    paths:
      - .github/workflows/council-language-docs-extract.yml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install extraction dependencies
        run: sudo apt-get update && sudo apt-get install -y awscli unzip xz-utils
      - name: Download and inspect archive entries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archives extracted/python/3.15 extracted/cpp/cppreference-20250209 extracted/rust/1.99.0
          curl -fL --retry 3 'https://docs.python.org/3.15/archives/python-3.15-docs-html.zip' -o archives/python.zip
          curl -fL --retry 3 'https://github.com/PeterFeicht/cppreference-doc/releases/download/v20250209/html-book-20250209.zip' -o archives/cpp.zip
          curl -fL --retry 3 'https://static.rust-lang.org/dist/rust-docs-1.99.0-x86_64-unknown-linux-gnu.tar.xz' -o archives/rust.tar.xz
          python3 - <<'PY'
          import pathlib, tarfile, zipfile
          root = pathlib.Path('archives')
          for name in ('python.zip','cpp.zip'):
              with zipfile.ZipFile(root/name) as f:
                  bad=f.testzip()
                  if bad: raise ValueError(f'Corrupt member: {bad}')
                  for m in f.infolist():
                      p=pathlib.PurePosixPath(m.filename)
                      if p.is_absolute() or '..' in p.parts or m.filename.startswith('\\'):
                          raise ValueError(f'Unsafe ZIP path: {m.filename}')
                      if ((m.external_attr >> 16) & 0o170000) == 0o120000:
                          raise ValueError(f'ZIP symlink prohibited: {m.filename}')
          with tarfile.open(root/'rust.tar.xz','r:xz') as f:
              for m in f:
                  p=pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts or not (m.isfile() or m.isdir()):
                      raise ValueError(f'Unsafe TAR member: {m.name}')
          PY
          unzip -q archives/python.zip -d extracted/python/3.15
          unzip -q archives/cpp.zip -d extracted/cpp/cppreference-20250209
          python3 - <<'PY'
          import pathlib, tarfile
          dest=pathlib.Path('extracted/rust/1.99.0')
          with tarfile.open('archives/rust.tar.xz','r:xz') as f:
              for m in f:
                  if m.isdir():
                      (dest / m.name).mkdir(parents=True,exist_ok=True)
                  elif m.isfile():
                      p=dest/m.name
                      p.parent.mkdir(parents=True,exist_ok=True)
                      src=f.extractfile(m)
                      if src is None: raise RuntimeError(m.name)
                      with src, p.open('wb') as out:
                          import shutil
                          shutil.copyfileobj(src,out)
          PY
      - name: Create checksum manifest without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, pathlib
          files = []
          for p in sorted(pathlib.Path('extracted').rglob('*')):
              if p.is_file():
                  files.append({'path':p.relative_to('extracted').as_posix(),'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          manifest = {'schema_version':1,'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'file_count':len(files),'files':files}
          pathlib.Path('extracted-manifest.json').write_text(json.dumps(manifest,separators=(',',':')))
          print('Validated files:',len(files))
          if not any(f['path'].endswith('.html') for f in files):
              raise ValueError('No HTML pages extracted')
          PY
      - name: Publish extraction as private CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: council-language-html-staging
          path: |
            extracted/
            extracted-manifest.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload extracted files to Cloudflare R2 with GitHub OIDC
        env:
          UPLOAD_ENDPOINT: https://council-language-docs-upload.council-docs-r2-2f1fd544.workers.dev/upload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, threading, time, urllib.parse, urllib.request
          base=pathlib.Path('extracted')
          files=[p for p in base.rglob('*') if p.is_file()]
          token=''
          expiry=0
          lock=threading.Lock()
          def auth():
              global token,expiry
              with lock:
                  if time.time()<expiry:return token
                  url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
                  sep='&' if '?' in url else '?'
                  url+=sep+'audience='+urllib.parse.quote('council-language-docs-r2-upload-v1')
                  req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
                  with urllib.request.urlopen(req,timeout=30) as res:
                      token=json.load(res)['value']
                  expiry=time.time()+120
                  return token
          def upload(p):
              rel=p.relative_to(base).as_posix()
              data=p.read_bytes()
              digest=hashlib.sha256(data).hexdigest()
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(os.environ['UPLOAD_ENDPOINT'],data=data,method='PUT',headers={
                          'Authorization':'Bearer '+auth(),
                          'X-Docs-Path':rel,
                          'X-Docs-Sha256':digest,
                          'Content-Type':'application/octet-stream'
                      })
                      with urllib.request.urlopen(req,timeout=90) as res:
                          result=json.load(res)
                      if result.get('sha256')!=digest: raise ValueError('Uploaded checksum differs')
                      return rel
                  except Exception:
                      if attempt==3:raise
                      time.sleep(2*(attempt+1))
          failures=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              future_map={pool.submit(upload,p):p for p in files}
              for completed in concurrent.futures.as_completed(future_map):
                  try:completed.result()
                  except Exception as e:failures.append((str(future_map[completed]),str(e)))
          print('Total:',len(files),'Failed:',len(failures))
          if failures:
              for path,error in failures[:20]:print('FAILED',path,error)
              raise RuntimeError('R2 upload incomplete')
          PY
