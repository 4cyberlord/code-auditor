name: Repair package lock for Node 24
on:
  push:
    branches: [feat/r2-language-retrieval-20261015]
    paths: [.github/workflows/council-lock-sync.yml]
permissions:
  contents: write
jobs:
  repair-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Reconcile lock against package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check clean reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit corrected lockfile on feature branch
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'No lock changes needed'
            exit 0
          fi
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add package-lock.json
          git commit -m 'chore: sync npm lockfile for Node 24 CI'
          git push origin HEAD:feat/r2-language-retrieval-20261015
