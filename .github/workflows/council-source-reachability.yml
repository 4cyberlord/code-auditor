name: Council Docs Source Reachability
on:
  push:
    branches: [feat/r2-language-retrieval-20261015]
    paths: [.github/workflows/council-source-reachability.yml]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify user-hosted HTML pages
        shell: bash
        run: |
          set -euo pipefail
          for uri in \
            'http://144.24.31.129/offline-docs/python-3.15.0/python-3.15-docs-html/index.html' \
            'http://144.24.31.129/offline-docs/rust-1.99.0/index.html' \
            'http://144.24.31.129/offline-docs/cpp-26-wg21-n5050/html/index.html'
          do
            echo "Checking $uri"
            curl -L --fail --max-time 15 -sS -o /dev/null -w 'HTTP %{http_code}; bytes %{size_download}\n' "$uri"
          done
      - name: Check Cloudflare Worker endpoint with standard HTTP clients
        shell: bash
        run: |
          for agent in 'Mozilla/5.0' 'curl/8.5.0'; do
            echo "Checking Cloudflare Worker using $agent"
            curl -L --max-time 20 -sS -A "$agent" -w '\nHTTP %{http_code}\n' 'https://council-language-source-probe.council-docs-r2-2f1fd544.workers.dev/probe' | head -c 1500 || true
          done
