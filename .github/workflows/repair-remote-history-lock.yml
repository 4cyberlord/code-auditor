name: Repair remote-history branch lockfile
on:
  push:
    branches:
      - fix/remote-helper-durable-history
permissions:
  contents: write
jobs:
  reconcile:
    if: "!contains(github.event.head_commit.message, '[skip lock repair]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconcile manifest and lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit deterministic dependency graph
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(lockfile): reconcile missing dependency entries [skip lock repair]"
            git push
          fi
