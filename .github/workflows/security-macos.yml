name: Security branch macOS validation
on:
  pull_request:
    branches:
      - main
      - feat/cloud-thin-client-phase1
      # CI for the stacked Hobby E2B PR, without changing its parent/merge base.
      - perf/parallel-language-harness-20261016
  workflow_dispatch:
concurrency:
  group: security-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-validation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        id: rust-toolchain
        # GitHub hosted macOS occasionally cannot resolve static.rust-lang.org.
        # A bounded retry below recovers transient DNS failures without skipping Rust checks.
        continue-on-error: true
      - name: Recover transient Rust toolchain download failure
        if: steps.rust-toolchain.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            echo "Rust toolchain install retry ${attempt}/4"
            if rustup toolchain install stable --profile minimal --no-self-update &&
               rustup default stable && rustc --version && cargo --version; then
              echo "Rust toolchain recovered."
              exit 0
            fi
            if [[ "$attempt" -lt 4 ]]; then sleep $((attempt * 12)); fi
          done
          echo "::error::Rust toolchain cannot be installed after four attempts; investigate DNS/TLS to static.rust-lang.org, not the application source."
          exit 1
      - name: Verify Rust toolchain
        run: rustc --version && cargo --version
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: council-macos-rust
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Node tests
        run: npm test
      - name: Release configuration preflight
        run: npm run release:preflight
      - name: Prepare Tauri external binary placeholder for Rust tests
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\\nexit 70\\n' > "src-tauri/binaries/mds-${target}"
          chmod +x "src-tauri/binaries/mds-${target}"
      - name: Rust security regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib coding_tools::security_tests -- --nocapture
      - name: Helper regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --bin mds
      - name: Rust compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Prepare real sidecar and frontend
        env:
          CODE_AUDITOR_ALLOW_ADHOC: '1'
        run: npm run helper:sidecar
      - name: Build desktop application (ad-hoc CI validation only)
        env:
          CODE_AUDITOR_ALLOW_ADHOC: '1'
        run: |
          # The checked-in Tauri config deliberately requires a real
          # Developer ID for distributable releases. GitHub PR runners do
          # not have that certificate. Override only this CI build.
          APPLE_SIGNING_IDENTITY=- npx tauri build --bundles app
          # Clear signing identity before the local-use DMG helper; a
          # distributable signed/notarized release remains a separate gate.
          node scripts/package-dmg.mjs
          test -d "src-tauri/target/release/bundle/macos/Activity Monitor.app"
          find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f -size +1M | grep -q .

  harness-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # rustc is present but may be unset on the runner image.
      - name: Ensure native toolchains
        run: rustup default stable >/dev/null 2>&1 || true
      - name: Good and bad candidate per certified template
        env:
          REQUIRE_TOOLCHAINS: '1'
        run: node tests/harnessCertification.test.ts

  docker-runtime-containment:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Pull test image (CI only; app never pulls implicitly)
        run: |
          if docker pull public.ecr.aws/docker/library/alpine:3.20; then
            echo "CONTAINMENT_IMAGE=public.ecr.aws/docker/library/alpine:3.20" >> "$GITHUB_ENV"
          elif docker pull alpine:3.20; then
            echo "CONTAINMENT_IMAGE=alpine:3.20" >> "$GITHUB_ENV"
          elif docker pull quay.io/libpod/alpine:3.20; then
            echo "CONTAINMENT_IMAGE=quay.io/libpod/alpine:3.20" >> "$GITHUB_ENV"
          else
            echo "::error::All public Alpine registries failed; cannot verify container containment."
            exit 1
          fi
      - name: Verify container isolation and cleanup on real Docker
        run: bash tests/security/docker-containment.sh

  e2b-harness-certification:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Certification slice inside E2B
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          CODE_AUDITOR_E2B_TEMPLATE: ${{ vars.CODE_AUDITOR_E2B_TEMPLATE }}
          REQUIRE_PINNED_E2B: ${{ vars.CODE_AUDITOR_E2B_TEMPLATE != '' && '1' || '0' }}
        run: node scripts/certify-e2b.mjs

  e2e-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Screenshot to verified answer
        env:
          COUNCIL_E2E_TOKEN: ${{ secrets.COUNCIL_E2E_TOKEN }}
        run: node scripts/e2e-acceptance.mjs

  e2b-live-smoke:
    # Secrets never enter pull-request builds. Run explicitly on the trusted branch.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Live E2B smoke test
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: node tests/security/e2b-smoke.mjs
