name: Security branch macOS validation
on:
  push:
    branches:
      - security/coding-shell-opt-in
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  macos-validation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Node tests
        run: npm test
      - name: Rust security regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib coding_tools::security_tests -- --nocapture
      - name: Rust compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Build desktop application (unsigned CI build)
        env:
          CODE_AUDITOR_ALLOW_ADHOC: '1'
        run: npm run app:build
