name: Security branch macOS validation
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: security-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-validation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: council-macos-rust
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Node tests
        run: npm test
      - name: Release configuration preflight
        run: npm run release:preflight
      - name: Prepare Tauri external binary placeholder for Rust tests
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\\nexit 70\\n' > "src-tauri/binaries/mds-${target}"
          chmod +x "src-tauri/binaries/mds-${target}"
      - name: Rust security regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib coding_tools::security_tests -- --nocapture
      - name: Helper regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --bin mds
      - name: Rust compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Prepare real sidecar and frontend
        env:
          CODE_AUDITOR_ALLOW_ADHOC: '1'
        run: npm run helper:sidecar
      - name: Build desktop application (unsigned CI build)
        env:
          CODE_AUDITOR_ALLOW_ADHOC: '1'
        run: npm run app:build

  dependency-audit:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run npm audit fix and report outstanding lockfile changes
        run: |
          set +e
          npm audit fix --package-lock-only --ignore-scripts --no-fund > audit-fix.log 2>&1
          status=$?
          set -e
          tail -n 80 audit-fix.log
          echo "npm audit fix exit code: $status"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const original = JSON.parse(execFileSync("git", ["show", "HEAD:package-lock.json"], { encoding: "utf8" }));
          const changed = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const delta = Object.fromEntries(Object.entries(changed.packages)
            .filter(([key, value]) => JSON.stringify(value) !== JSON.stringify(original.packages?.[key])));
          const removed = Object.keys(original.packages).filter(key => !(key in changed.packages));
          console.log("AUDIT_FIX_DELTA_JSON=" + JSON.stringify({ packages: delta, removed, root: changed.packages[""] }));
          NODE
      - name: Audit all installed dependencies, including development packages
        run: npm audit --audit-level=high
      - name: Confirm npm audit fixes are committed to the lockfile
        run: git diff --exit-code -- package-lock.json

  docker-runtime-containment:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Pull test image (CI only; app never pulls implicitly)
        run: |
          if docker pull public.ecr.aws/docker/library/alpine:3.20; then
            echo "CONTAINMENT_IMAGE=public.ecr.aws/docker/library/alpine:3.20" >> "$GITHUB_ENV"
          elif docker pull alpine:3.20; then
            echo "CONTAINMENT_IMAGE=alpine:3.20" >> "$GITHUB_ENV"
          elif docker pull quay.io/libpod/alpine:3.20; then
            echo "CONTAINMENT_IMAGE=quay.io/libpod/alpine:3.20" >> "$GITHUB_ENV"
          else
            echo "::error::All public Alpine registries failed; cannot verify container containment."
            exit 1
          fi
      - name: Verify container isolation and cleanup on real Docker
        run: bash tests/security/docker-containment.sh

  e2b-live-smoke:
    # Secrets never enter pull-request builds. Run explicitly on the trusted branch.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Live E2B smoke test
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: node tests/security/e2b-smoke.mjs
