[package]
name = "council-editor"
version = "0.2.0"
description = "Multi-agent code & research auditor"
authors = ["Charles"]
edition = "2021"
rust-version = "1.77"
default-run = "council-editor"
autobins = false

[lib]
name = "council_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "council-editor"
path = "src/main.rs"

[[bin]]
name = "mds"
path = "src/bin/mds.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
global-hotkey = "0.8"
tao = "0.35"
wry = "0.55"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
keyring = { version = "3", features = ["apple-native"] }
security-framework = "3.7"
objc2-vision = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow"] }
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
window-vibrancy = "0.6"
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
