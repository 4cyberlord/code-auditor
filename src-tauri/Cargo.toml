[package]
name = "council-editor"
version = "0.1.0"
description = "Multi-agent code & research auditor"
authors = ["Charles"]
edition = "2021"
rust-version = "1.77"
# Two binaries live in this crate — the app and the background sync helper — so a
# bare `cargo run` has no way to choose, and `tauri dev` issues exactly that.
# Naming the app as the default is what makes `npm run app:dev` work; the helper
# is still reachable with `cargo run --bin cloud-sync-helper`.
default-run = "council-editor"

[lib]
name = "council_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "council-editor"
path = "src/main.rs"

[[bin]]
name = "cloud-sync-helper"
path = "src/bin/cloud-sync-helper.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon keeps the app alive in the menu bar; image-png loads the template icon.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
thiserror = "2"
# sqlx, argon2, hmac and sha2 were all dropped when the app stopped talking to
# Postgres directly. Queries live in the Edge Function and in plpgsql now, and
# the PIN is hashed and verified server-side — so the client links neither a
# database driver nor a password hasher, and builds a good deal faster for it.
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
global-hotkey = "0.8"
tao = "0.37"
chrono = { version = "0.4", features = ["serde"] }

# No mobile implementation exists, so keep it off the mobile targets entirely.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
keyring = { version = "3", features = ["apple-native"] }
# The transcriber is Apple's on-device Vision framework: no key, no quota, no
# network. Defaults pull in VNRecognizeTextRequest, VNObservation, VNRequest,
# VNRequestHandler, VNTypes, VNUtils and the core-foundation geometry types.
objc2-vision = "0.3"
objc2 = "0.6"                  # Retained, ClassType
objc2-app-kit = { version = "0.3", features = ["NSWindow"] }
objc2-foundation = "0.3"       # NSData, NSArray, NSDictionary, NSString, NSError
objc2-core-foundation = "0.3"  # CGRect, CGSize (bounding box -> pixel conversion)
window-vibrancy = "0.6"        # native frosted-glass panel for the background helper overlay
base64 = "0.22"                # decode ImageInput.data -> bytes (raw base64)

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
