[package]
name = "code-auditor"
version = "0.1.0"
description = "Multi-agent code & research auditor"
authors = ["Charles"]
edition = "2021"
rust-version = "1.77"
# Two binaries live in this crate — the app and the background sync helper — so a
# bare `cargo run` has no way to choose, and `tauri dev` issues exactly that.
# Naming the app as the default is what makes `npm run app:dev` work; the helper
# is still reachable with `cargo run --bin cloud-sync-helper`.
default-run = "code-auditor"

[lib]
name = "code_auditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "code-auditor"
path = "src/main.rs"

[[bin]]
name = "cloud-sync-helper"
path = "src/bin/cloud-sync-helper.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon keeps the app alive in the menu bar; image-png loads the template icon.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
thiserror = "2"
# Runtime-checked queries only (no `query!` macros), so the app builds without
# database credentials present in the environment.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json",
] }
uuid = { version = "1", features = ["v4", "serde"] }
global-hotkey = "0.8"
tao = "0.37"

# Login. Argon2id for the PIN itself; HMAC-SHA256 to pepper it with a Keychain
# secret first, so a stolen database dump is not an offline attack on four
# digits. See src/auth.rs for why the pepper carries most of the weight here.
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }

# No mobile implementation exists, so keep it off the mobile targets entirely.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# The transcriber is Apple's on-device Vision framework: no key, no quota, no
# network. Defaults pull in VNRecognizeTextRequest, VNObservation, VNRequest,
# VNRequestHandler, VNTypes, VNUtils and the core-foundation geometry types.
objc2-vision = "0.3"
objc2 = "0.6"                  # Retained, ClassType
objc2-foundation = "0.3"       # NSData, NSArray, NSDictionary, NSString, NSError
objc2-core-foundation = "0.3"  # CGRect, CGSize (bounding box -> pixel conversion)
base64 = "0.22"                # decode ImageInput.data -> bytes (raw base64)

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
