services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PROXY_DOMAIN: ${PROXY_DOMAIN}
      SUPABASE_ORIGIN: ${SUPABASE_ORIGIN}
      SUPABASE_HOST: ${SUPABASE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
